name: Compilar y Subir por FTP

on:
  push:
    branches: [ main ]

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    steps:
    - name: Get latest code
      uses: actions/checkout@v4.1.0

    - name: Use Node.js
      uses: actions/setup-node@v4.1.0
      with:
        node-version: '22' # Actualizado a Node 22 para limpiar las advertencias de obsolescencia

    - name: Install dependencies
      run: npm install # Cambiado a 'npm install' para evitar fallos si tu package-lock.json no está perfectamente sincronizado

    - name: Build Project
      run: npm run build

    - name: Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/
        dangerous-clean-slate: false
